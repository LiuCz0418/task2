server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/es?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# JWT 配置
jwt:
  secret: SecondHandTradingPlatformSecretKey2024VeryLongAndSecure
  expiration: 604800000  # 7天

# 文件上传配置
upload:
  path: D:/JAVA/邵灵/backend/uploads/
  max-size: 10485760  # 10MB

# 日志配置
logging:
  level:
    com.es.secondhand: DEBUG
    org.hibernate.SQL: DEBUG
